
experiment:
  name: "Data Processing Performance Benchmark"
  version: "1.0.0"

input_data:
  sample_path: "data/sample/test_data.csv"
  encoding: "utf-8"

benchmark_params:
  iterations: 100
  warmup_runs: 5
  aggregation_target: "category"
  metric_target: "transaction_amount"

logging:
  output_file: "benchmark_results.log"
